<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>AI学习助手</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>AI学习助手</h1>

    <input type="file" id="pdfFile" />

    <button onclick="uploadPDF()">上传PDF</button>

    <br /><br />

    <textarea id="userInput" rows="6" cols="60"></textarea>

    <br /><br />

    <button onclick="sendMessage()">发送</button>

    <button onclick="learnMode()">学习模式</button>

    <button onclick="ragMode()">知识库问答</button>

    <h2>聊天记录：</h2>

    <div id="loadingText" style="display: none; color: gray; margin: 10px">
      AI 正在思考中...
    </div>

    <div id="chatBox"></div>

    <script src="app.js"></script>
  </body>
</html>
