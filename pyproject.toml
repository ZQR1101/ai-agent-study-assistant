[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rulebook-review"
dynamic = ["version"]
description = "Rulebook: rulebook-driven document review platform with citation-gated scoring, expert sign-off gates and full audit trails, shipped as a local web app + CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["rulebook", "document-review", "compliance", "contract-review", "agents", "rag", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "langchain",
    "langchain-openai",
    "sentence-transformers",
    "scikit-learn",
    "pypdf",
    "python-multipart",
    "faiss-cpu",
    "langgraph",
    "SQLAlchemy",
    "psycopg[binary]",
    "python-docx",
    "openpyxl",
]

[project.optional-dependencies]
# Optional scanned-PDF OCR support (pip install rulebook-review[ocr])
ocr = ["rapidocr-onnxruntime", "PyMuPDF"]
dev = ["pytest"]

[project.scripts]
rulebook = "backend.cli:main"

[project.urls]
Homepage = "https://github.com/ZQR1101/rulebook"

[tool.setuptools.dynamic]
version = { attr = "backend.__version__" }

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = [
    "static/*",
    "static/**/*",
    "env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
